AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - "vendor/**/*"
    # Каталоги прогона оценочных задач: там лежит код, написанный МОДЕЛЬЮ,
    # а не нами. Линтовать его бессмысленно вдвойне — стиль этих файлов
    # ничего не говорит о проекте, а `make` из-за них падал бы после каждого
    # `make evals`, пока каталог не снесёшь.
    - "evals/results/**/*"

# Спеки описательные, длина блоков здесь не показатель сложности.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "mini_agent.gemspec"

Metrics/MethodLength:
  Max: 18

# Разбор ответа LLM и цикл агента линейны: дробить их ради метрики
# означало бы разнести по методам последовательность из проверок подряд.
Metrics/AbcSize:
  Max: 22

Metrics/CyclomaticComplexity:
  Max: 8

# Ключевые аргументы не считаются: правило защищает от нечитаемого
# позиционного вызова вида f(a, b, nil, true, 3), а имя на месте вызова эту
# задачу уже решает. Внедрение зависимостей здесь принципиальное (см. CLAUDE.md),
# и у Agent шесть именованных сотрудников — не длинный список, а полный состав.
Metrics/ParameterLists:
  CountKeywordArgs: false

# Порог трижды срабатывал верно: из LLMClient так выделились ErrorResponse
# и ChatResponse, из UI — ContextView. Поднят со 130 до 135 один раз, когда
# в LLMClient добавилась обработка исчерпанного ожидания, и тогда же было
# записано, что делить его дальше нечего. Это оказалось неверно: с общим
# сроком на ответ у соединения завёлся третий исход (оборвали чтение,
# соединение непригодно), и оттуда выделился Connection. Прежде чем
# поднимать снова, ищите в классе чужую задачу: до сих пор она находилась
# всегда — в том числе там, где её уже объявили отсутствующей.
Metrics/ClassLength:
  Max: 135

# Messages — каталог строк, а не логика: его длина растёт с числом сообщений
# и о сложности ничего не говорит. Существующее деление на слои (Tool — то,
# что уходит в модель) смысловое; дробить каталог ещё и по размеру значило бы
# заводить модули, про которые нельзя сказать, что в них лежит.
Metrics/ModuleLength:
  Exclude:
    - "lib/mini_agent/messages.rb"

# ui:, id, io — устоявшиеся короткие имена, читаются однозначно.
Naming/MethodParameterName:
  AllowedNames:
    - ui
    - id
    - io
    - to

# Русские строки в сообщениях — норма для этого проекта.
Style/AsciiComments:
  Enabled: false

# Блок у webmock-матчера `.with { |req| ... }` — это условие проверки, а не
# процедура. Автокоррекция переписывала его в do...end, после чего блок
# привязывался к внешнему `expect`, а не к `.with`: матчер переставал
# проверять тело запроса, и тест проходил при любом ответе. Ошибка тихая —
# и rubocop, и rspec остаются зелёными. Исключаем `with` из правила.
Style/BlockDelimiters:
  AllowedMethods:
    - lambda
    - proc
    - it
    - with

Layout/LineLength:
  Max: 120

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
